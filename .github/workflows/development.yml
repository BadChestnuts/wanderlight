name: Check development version

on:
  push:
    branches:
      - develop
      - 'feature/**'
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Get project source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check travel records and map data
        run: node --test tests/travel.test.mjs
      - name: Check static website files
        run: node scripts/verify.mjs
